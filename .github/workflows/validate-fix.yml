name: Validate settings and tray fix

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test settings persistence
        run: dotnet test tests/ExplorerTabUtility.Tests/ExplorerTabUtility.Tests.csproj --configuration Release --verbosity normal

  build:
    needs: tests
    runs-on: windows-latest
    strategy:
      matrix:
        framework: [net9.0-windows, net481]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build portable application
        shell: pwsh
        run: >-
          msbuild ExplorerTabUtility/ExplorerTabUtility.csproj /restore /t:Publish
          /p:Configuration=Release /p:TargetFramework=${{ matrix.framework }}
          /p:RuntimeIdentifier=win-x64 /p:PublishDir=${{ github.workspace }}/artifacts/portable/
          /p:DebugType=none /verbosity:minimal /nologo
      - uses: actions/upload-artifact@v4
        with:
          name: ExplorerTabUtility-tray-fix-x64-${{ matrix.framework }}
          path: artifacts/portable/
